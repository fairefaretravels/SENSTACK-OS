<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENSTACK OS — Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060607;
    --panel:#0D0E10;
    --panel-line: rgba(255,255,255,0.07);
    --fg:#F2F1EC;
    --muted:#84868C;
    --accent:#FF5A36;
    --accent-dim: rgba(255,90,54,0.35);
    --online:#4ADE80;
    --display: 'Space Grotesk', -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:var(--display); background:var(--bg); color:var(--fg);
    min-height:100vh;
  }

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px clamp(20px, 5vw, 56px);
    background: rgba(6,6,7,0.82);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--panel-line);
  }
  .back-link{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:12px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--muted); text-decoration:none;
    transition: color 0.25s ease;
  }
  .back-link:hover{ color:var(--accent); }
  .back-link svg{ width:14px; height:14px; }

  .brand{
    font-family:var(--mono); font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted);
  }
  .brand span{ color:var(--accent); }

  /* ---------- HEADER ---------- */
  .header{
    padding: 64px clamp(20px, 5vw, 56px) 28px;
    max-width:1280px; margin:0 auto;
  }
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--accent); margin-bottom:16px;
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{
    content:''; width:6px; height:6px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 8px 1px var(--accent-dim);
  }
  h1{
    font-size: clamp(2rem, 5vw, 3.4rem);
    font-weight:700; letter-spacing:-0.01em; line-height:1.05;
    max-width:14ch;
  }
  .sub{
    margin-top:18px; max-width:52ch;
    color:var(--muted); font-size:15px; line-height:1.6;
  }
  .headcount{
    margin-top:28px;
    font-family:var(--mono); font-size:12px; color:var(--muted);
    display:flex; gap:22px; flex-wrap:wrap;
  }
  .headcount b{ color:var(--fg); font-weight:600; }

  /* ---------- ROSTER GRID ---------- */
  .roster{
    max-width:1280px; margin:0 auto;
    padding: 20px clamp(20px, 5vw, 56px) 100px;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap:1px;
    background: var(--panel-line);
    border:1px solid var(--panel-line);
  }

  .card{
    background: var(--panel);
    padding: 28px 24px 26px;
    position:relative;
    overflow:hidden;
    transition: background 0.35s ease;
  }
  .card::before{
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(160deg, var(--accent-dim), transparent 55%);
    opacity:0;
    transition: opacity 0.4s ease;
    pointer-events:none;
  }
  .card:hover::before{ opacity:0.14; }
  .card:hover{ background:#131418; }

  .card-top{
    display:flex; align-items:flex-start; justify-content:space-between;
    margin-bottom:18px;
  }
  .id-tag{
    font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:0.08em;
  }
  .status{
    display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted);
  }
  .status .dot{
    width:6px; height:6px; border-radius:50%; background:var(--online);
    box-shadow:0 0 6px 1px rgba(74,222,128,0.5);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }

  .photo-wrap{
    width:100%; aspect-ratio: 1 / 1;
    border-radius:10px; overflow:hidden;
    filter: grayscale(0.35) brightness(0.92);
    transition: filter 0.4s ease, transform 0.4s ease;
    margin-bottom:18px;
  }
  .card:hover .photo-wrap{ filter:grayscale(0) brightness(1); }
  .photo-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }

  .name{ font-size:19px; font-weight:600; letter-spacing:-0.01em; }
  .title{
    font-family:var(--mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--accent); margin-top:5px;
  }
  .blurb{
    margin-top:12px; font-size:13.5px; line-height:1.55; color:var(--muted);
  }

  .divider{
    height:1px; background:var(--panel-line); margin:18px 0 14px;
  }
  .specs{
    display:flex; flex-wrap:wrap; gap:6px;
  }
  .chip{
    font-family:var(--mono); font-size:10px; letter-spacing:0.04em;
    color:#C9CACE; background:rgba(255,255,255,0.05);
    border:1px solid var(--panel-line);
    padding:4px 9px; border-radius:999px;
  }

  @media (max-width:520px){
    .roster{ grid-template-columns:1fr; }
  }

  @media (prefers-reduced-motion: reduce){
    .status .dot{ animation:none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    Back
  </a>
  <div class="brand">SENSTACK<span> OS</span></div>
</div>

<div class="header">
  <div class="eyebrow">Agent Roster — Active</div>
  <h1>Your AI staff, on the clock.</h1>
  <p class="sub">Eleven agents, each running a function of the business. No shifts, no turnover — just the roles filled and the work moving.</p>
  <div class="headcount">
    <div><b id="countTotal">11</b> agents deployed</div>
    <div><b>24/7</b> uptime</div>
    <div><b>0</b> open seats</div>
  </div>
</div>

<div class="roster" id="roster"></div>

<script>
  const baseUrl = "https://raw.githubusercontent.com/fairefaretravels/SENSTACK-OS/main/";

  const staff = [
    {
      file: "Female_CEO.jpeg",
      name: "CEO AI",
      title: "Chief Executive",
      blurb: "Sets direction, owns the roadmap, and makes the final call when priorities collide.",
      specs: ["Strategy", "Decisions", "Vision"]
    },
    {
      file: "AI_executive.jpeg",
      name: "Executive AI",
      title: "Senior Leadership",
      blurb: "Turns strategy into execution and keeps every function accountable to the plan.",
      specs: ["Oversight", "Planning"]
    },
    {
      file: "AI_executive_assistant.jpeg",
      name: "Executive Assistant AI",
      title: "Executive Support",
      blurb: "Runs the calendar, triages the inbox, and keeps leadership focused on what matters.",
      specs: ["Scheduling", "Comms", "Triage"]
    },
    {
      file: "AI_manager.jpeg",
      name: "Operations AI",
      title: "Operations Manager",
      blurb: "Keeps the day-to-day machine running — processes, handoffs, and the small stuff that adds up.",
      specs: ["Workflows", "Ops"]
    },
    {
      file: "AI_marketing-Strategist.jpeg",
      name: "Marketing AI",
      title: "Marketing Strategist",
      blurb: "Builds the positioning and campaigns that get the business in front of the right people.",
      specs: ["Campaigns", "Positioning", "Brand"]
    },
    {
      file: "AI_sales_executive.jpeg",
      name: "Sales AI",
      title: "Sales Executive",
      blurb: "Works the pipeline end to end — outreach, follow-up, and closing the deal.",
      specs: ["Outreach", "Pipeline", "Closing"]
    },
    {
      file: "AI_advisor.jpeg",
      name: "Business Advisor AI",
      title: "Advisor",
      blurb: "Weighs the options and flags the risks before a decision gets made, not after.",
      specs: ["Guidance", "Risk"]
    },
    {
      file: "AI_analyst.jpeg",
      name: "Business Analyst AI",
      title: "Analyst",
      blurb: "Turns raw numbers into the reporting leadership actually uses to make calls.",
      specs: ["Reporting", "Metrics"]
    },
    {
      file: "AI_specialist.jpeg",
      name: "Specialist AI",
      title: "On-Demand Specialist",
      blurb: "Drops in for the niche problems that need deep, focused expertise.",
      specs: ["Expertise", "On-demand"]
    },
    {
      file: "Creative_director.jpeg",
      name: "Content Creator AI",
      title: "Creative Director",
      blurb: "Shapes the brand voice and produces the content that carries it everywhere.",
      specs: ["Content", "Brand voice"]
    },
    {
      file: "Data-Intelligence.jpeg",
      name: "Data Intelligence AI",
      title: "Data Intelligence",
      blurb: "Watches the data for patterns and surfaces what's worth acting on.",
      specs: ["Insights", "Forecasting"]
    }
  ];

  const roster = document.getElementById('roster');

  staff.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <div class="id-tag">STAFF-${String(i + 1).padStart(3, '0')}</div>
        <div class="status"><span class="dot"></span>Online</div>
      </div>
      <div class="photo-wrap"><img src="${baseUrl}${s.file}" alt="${s.name}"></div>
      <div class="name">${s.name}</div>
      <div class="title">${s.title}</div>
      <p class="blurb">${s.blurb}</p>
      <div class="divider"></div>
      <div class="specs">${s.specs.map(sp => `<span class="chip">${sp}</span>`).join('')}</div>
    `;
    roster.appendChild(card);
  });
</script>

</body>
</html>
