<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENSTACK OS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  /* Video background */
  .video-bg {
    position: absolute;
    top: 50%; left: 50%;
    min-width: 100%; min-height: 100%;
    width: auto; height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    z-index: 1;
    filter: brightness(0.55) saturate(1.05);
  }

  /* Dark gradient for depth */
  .overlay-gradient {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.65) 100%);
    pointer-events: none;
  }

  /* Photo slideshow layer */
  .slide-layer {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .slide {
    position: absolute;
    width: min(78vw, 620px);
    height: min(78vw, 620px);
    max-width: 620px;
    max-height: 620px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 90px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06);
    opacity: 0;
    transform: scale(0.94);
    transition: opacity 1.4s ease, transform 8s ease-out;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .slide.active {
    opacity: 1;
    transform: scale(1.03);
    transition: opacity 1.4s ease, transform 7s ease-out;
  }

  /* Subtle vignette frame */
  .slide::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.35);
    border-radius: 18px;
  }

  /* Progress dots */
  .dots {
    position: absolute;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    display: flex;
    gap: 8px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transition: background 0.4s ease, width 0.4s ease;
  }

  .dot.active {
    background: rgba(255,255,255,0.9);
    width: 18px;
    border-radius: 3px;
  }
</style>
</head>
<body>

<div class="hero">
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="https://raw.githubusercontent.com/fairefaretravels/SENSTACK-OS/main/Senblack.mp4" type="video/mp4">
  </video>

  <div class="overlay-gradient"></div>

  <div class="slide-layer" id="slideLayer"></div>

  <div class="dots" id="dots"></div>
</div>

<script>
  const baseUrl = "https://raw.githubusercontent.com/fairefaretravels/SENSTACK-OS/main/";
  const images = [
    "Female_CEO.jpeg",
    "AI_executive.jpeg",
    "AI_executive_assistant.jpeg",
    "AI_manager.jpeg",
    "AI_marketing-Strategist.jpeg",
    "AI_sales_executive.jpeg",
    "AI_advisor.jpeg",
    "AI_analyst.jpeg",
    "AI_specialist.jpeg",
    "Creative_director.jpeg",
    "Data-Intelligence.jpeg"
  ];

  const slideLayer = document.getElementById('slideLayer');
  const dotsLayer = document.getElementById('dots');

  images.forEach((file, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.id = 'slide-' + i;
    const img = document.createElement('img');
    img.src = baseUrl + file;
    img.alt = "";
    slide.appendChild(img);
    slideLayer.appendChild(slide);

    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.id = 'dot-' + i;
    dotsLayer.appendChild(dot);
  });

  let current = 0;
  const total = images.length;
  const intervalMs = 4200;

  function showSlide(index) {
    document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
    document.getElementById('slide-' + index).classList.add('active');
    document.getElementById('dot-' + index).classList.add('active');
  }

  showSlide(current);
  setInterval(() => {
    current = (current + 1) % total;
    showSlide(current);
  }, intervalMs);
</script>

</body>
</html>
