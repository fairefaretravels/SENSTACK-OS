<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENSTACK OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060607;
    --panel:#101114;
    --fg:#F2F1EC;
    --muted:#84868C;
    --accent:#FF5A36;
    --accent-dim: rgba(255,90,54,0.35);
    --line: rgba(255,255,255,0.08);
    --display: 'Space Grotesk', -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html, body{ width:100%; height:100%; background:var(--bg); overflow:hidden; }
  body{ font-family:var(--display); color:var(--fg); }

  /* ---------- BOOT SEQUENCE ---------- */
  #boot{
    position:fixed; inset:0; z-index:100;
    background:var(--bg);
    display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
    padding: 8vh 8vw;
    font-family:var(--mono);
    transition: opacity 0.6s ease, transform 0.8s cubic-bezier(.6,0,.2,1);
  }
  #boot.hide{ opacity:0; transform:translateY(-2%); pointer-events:none; }
  .boot-tag{
    font-size:11px; letter-spacing:0.18em; color:var(--muted); margin-bottom:22px;
    text-transform:uppercase;
  }
  .boot-line{
    font-size:13px; color:#C9CACE; letter-spacing:0.02em;
    opacity:0; transform:translateY(4px);
    animation: bootIn 0.4s ease forwards;
    margin-bottom:8px;
  }
  .boot-line span{ color:var(--accent); }
  .boot-bar-track{
    width:min(320px, 40vw); height:2px; background:var(--line); margin-top:18px; position:relative; overflow:hidden;
  }
  .boot-bar-fill{
    position:absolute; left:0; top:0; height:100%; width:0%;
    background:var(--accent);
    animation: bootFill 1.6s cubic-bezier(.4,0,.2,1) forwards;
    animation-delay: 0.3s;
  }
  @keyframes bootIn{ to{ opacity:1; transform:translateY(0);} }
  @keyframes bootFill{ to{ width:100%; } }

  /* ---------- HERO ---------- */
  .hero{ position:relative; width:100%; height:100vh; overflow:hidden; }

  .video-bg{
    position:absolute; top:50%; left:50%;
    min-width:100%; min-height:100%;
    transform:translate(-50%,-50%);
    object-fit:cover; z-index:1;
    filter: brightness(0.4) saturate(1.05) contrast(1.05);
  }

  .scrim{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 38%, rgba(6,6,7,0) 0%, rgba(6,6,7,0.55) 62%, rgba(6,6,7,0.92) 100%),
      linear-gradient(180deg, rgba(6,6,7,0.55) 0%, rgba(6,6,7,0.05) 22%, rgba(6,6,7,0.15) 60%, rgba(6,6,7,0.85) 100%);
  }

  .grain{
    position:absolute; inset:0; z-index:3; pointer-events:none; opacity:0.05; mix-blend-mode:overlay;
  }

  .stage{
    position:relative; z-index:4; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding: 0 6vw;
    opacity:0; transform:translateY(10px);
    transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1);
  }
  .stage.reveal{ opacity:1; transform:translateY(0); }

  .glow{
    position:absolute; width:60vmin; height:60vmin; border-radius:50%;
    background: radial-gradient(circle, var(--accent-dim) 0%, rgba(255,90,54,0) 68%);
    filter: blur(10px);
    opacity:0.55;
    z-index:-1;
  }

  .wordmark{
    font-size: clamp(2.6rem, 8vw, 6.4rem);
    font-weight:700;
    letter-spacing: 0.01em;
    line-height:1;
  }
  .wordmark .os{
    color:var(--accent);
    font-weight:500;
  }

  .tagline{
    margin-top:20px;
    font-family:var(--mono);
    font-size: clamp(11px, 1.1vw, 13px);
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .tick{
    width:40px; height:2px; background:var(--accent); margin:26px auto 0;
    transform-origin:center; animation: tickIn 1s cubic-bezier(.4,0,.2,1) 0.4s both;
  }
  @keyframes tickIn{ from{ width:0; opacity:0; } to{ width:40px; opacity:1; } }

  .active-agent{
    margin-top:34px; height:20px; font-family:var(--mono);
    font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
    color:#D9DADD; position:relative;
  }
  .active-agent .label{
    position:absolute; left:0; right:0; opacity:0;
    transition: opacity 0.5s ease;
  }
  .active-agent .label.show{ opacity:1; }
  .active-agent .idx{ color:var(--accent); margin-right:8px; }

  /* ---------- ENTER BUTTON ---------- */
  .enter-btn{
    margin-top:38px;
    display:inline-flex; align-items:center; gap:10px;
    padding: 14px 30px;
    border:1px solid var(--accent);
    border-radius:999px;
    background: transparent;
    color:var(--fg);
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    text-decoration:none;
    cursor:pointer;
    transition: background 0.35s ease, color 0.35s ease, box-shadow 0.35s ease, transform 0.25s ease;
  }
  .enter-btn:hover{
    background:var(--accent);
    color:#0A0A0A;
    box-shadow: 0 0 22px 2px var(--accent-dim);
    transform:translateY(-1px);
  }
  .enter-btn:active{ transform:translateY(0); }
  .enter-btn svg{ width:14px; height:14px; transition: transform 0.35s ease; }
  .enter-btn:hover svg{ transform:translateX(3px); }

  /* ---------- MUSIC TOGGLE (placeholder) ---------- */
  .music-toggle{
    position:fixed; top:24px; right:24px; z-index:10;
    width:44px; height:44px; border-radius:50%;
    border:1px solid var(--line);
    background: rgba(16,17,20,0.6);
    backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--fg);
    transition: border-color 0.3s ease, background 0.3s ease;
  }
  .music-toggle:hover{ border-color:var(--accent); }
  .music-toggle svg{ width:18px; height:18px; }
  .music-toggle .bars{ display:flex; align-items:flex-end; gap:2px; height:14px; }
  .music-toggle .bar{
    width:2.5px; background:var(--accent); border-radius:1px;
    animation: barPulse 0.9s ease-in-out infinite;
  }
  .music-toggle .bar:nth-child(1){ height:6px; animation-delay:0s; }
  .music-toggle .bar:nth-child(2){ height:14px; animation-delay:0.15s; }
  .music-toggle .bar:nth-child(3){ height:9px; animation-delay:0.3s; }
  .music-toggle.muted .bar{ animation-play-state:paused; height:4px !important; opacity:0.5; }
  @keyframes barPulse{
    0%, 100%{ transform:scaleY(0.4); }
    50%{ transform:scaleY(1); }
  }

  /* ---------- AGENT DOCK ---------- */
  .dock-wrap{
    position:absolute; left:0; right:0; bottom:38px; z-index:5;
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .dock{
    display:flex; gap: clamp(10px, 1.6vw, 20px);
    padding: 10px 18px;
    overflow-x:auto;
    max-width:92vw;
    scrollbar-width:none;
  }
  .dock::-webkit-scrollbar{ display:none; }

  .agent{
    flex: 0 0 auto;
    width:52px; height:52px; border-radius:50%;
    overflow:hidden; position:relative; cursor:pointer;
    filter: grayscale(0.55) brightness(0.6);
    transform:scale(0.92);
    transition: transform 0.5s cubic-bezier(.2,.8,.2,1), filter 0.5s ease, box-shadow 0.5s ease;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
  }
  .agent img{ width:100%; height:100%; object-fit:cover; display:block; }
  .agent.active{
    filter:grayscale(0) brightness(1);
    transform:scale(1.18);
    box-shadow: 0 0 0 2px var(--accent), 0 0 18px 2px var(--accent-dim);
  }

  .scrubber{
    display:flex; gap:5px;
  }
  .seg{
    width:16px; height:2px; background:var(--line); transition: background 0.4s ease;
  }
  .seg.active{ background:var(--accent); }

  @media (max-width:600px){
    .agent{ width:40px; height:40px; }
    .agent.active{ transform:scale(1.25); }
    .dock-wrap{ bottom:22px; }
    .music-toggle{ top:16px; right:16px; width:38px; height:38px; }
  }

  @media (prefers-reduced-motion: reduce){
    #boot{ display:none; }
    .stage{ opacity:1; transform:none; transition:none; }
    .agent{ transition:none; }
    .tick{ animation:none; width:40px; }
    .music-toggle .bar{ animation:none; }
  }
</style>
</head>
<body>

<div id="boot">
  <div class="boot-tag">Senstack OS — System Boot</div>
  <div class="boot-line" style="animation-delay:0.05s">&gt; initializing core<span>...</span></div>
  <div class="boot-line" style="animation-delay:0.35s">&gt; loading agent library <span>[11/11]</span></div>
  <div class="boot-line" style="animation-delay:0.65s">&gt; connecting modules<span>...</span></div>
  <div class="boot-line" style="animation-delay:0.95s">&gt; ready<span>.</span></div>
  <div class="boot-bar-track"><div class="boot-bar-fill"></div></div>
</div>

<!-- MUSIC PLACEHOLDER: swap the src below for your actual track -->
<audio id="bgMusic" loop preload="none">
  <source src="https://raw.githubusercontent.com/fairefaretravels/SENSTACK-OS/main/theme.mp3" type="audio/mpeg">
</audio>

<button class="music-toggle muted" id="musicToggle" aria-label="Toggle background music" title="Toggle music">
  <div class="bars">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
</button>

<div class="hero">
  <video class="video-bg" autoplay muted loop playsinline>
    <source src="https://raw.githubusercontent.com/fairefaretravels/SENSTACK-OS/main/Senblack.mp4" type="video/mp4">
  </video>
  <div class="scrim"></div>
  <svg class="grain" width="100%" height="100%">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <div class="stage" id="stage">
    <div class="glow" id="glow"></div>
    <div class="wordmark">SENSTACK<span class="os"> OS</span></div>
    <div class="tagline">Build the business. AI runs the system.</div>
    <div class="tick"></div>
    <div class="active-agent" id="activeAgent"></div>

    <a class="enter-btn" href="/HOME" id="enterBtn">
      Enter Senstack
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </a>
  </div>

  <div class="dock-wrap">
    <div class="dock" id="dock"></div>
    <div class="scrubber" id="scrubber"></div>
  </div>
</div>

<script>
  const baseUrl = "https://raw.githubusercontent.com/fairefaretravels/SENSTACK-OS/main/";
  const agents = [
    { file: "Female_CEO.jpeg", name: "CEO AI" },
    { file: "AI_executive.jpeg", name: "Executive AI" },
    { file: "AI_executive_assistant.jpeg", name: "Executive Assistant AI" },
    { file: "AI_manager.jpeg", name: "Operations AI" },
    { file: "AI_marketing-Strategist.jpeg", name: "Marketing AI" },
    { file: "AI_sales_executive.jpeg", name: "Sales AI" },
    { file: "AI_advisor.jpeg", name: "Business Advisor AI" },
    { file: "AI_analyst.jpeg", name: "Business Analyst AI" },
    { file: "AI_specialist.jpeg", name: "Specialist AI" },
    { file: "Creative_director.jpeg", name: "Content Creator AI" },
    { file: "Data-Intelligence.jpeg", name: "Data Intelligence AI" }
  ];

  const dock = document.getElementById('dock');
  const scrubber = document.getElementById('scrubber');
  const activeAgentEl = document.getElementById('activeAgent');

  agents.forEach((a, i) => {
    const el = document.createElement('div');
    el.className = 'agent';
    el.id = 'agent-' + i;
    el.innerHTML = '<img src="' + baseUrl + a.file + '" alt="">';
    el.addEventListener('click', () => setActive(i, true));
    dock.appendChild(el);

    const seg = document.createElement('div');
    seg.className = 'seg';
    seg.id = 'seg-' + i;
    scrubber.appendChild(seg);

    const label = document.createElement('div');
    label.className = 'label';
    label.id = 'label-' + i;
    label.innerHTML = '<span class="idx">' + String(i + 1).padStart(2, '0') + '</span>' + a.name;
    activeAgentEl.appendChild(label);
  });

  let current = 0;
  let timer = null;
  const total = agents.length;
  const intervalMs = 3400;

  function setActive(index, userTriggered) {
    document.querySelectorAll('.agent').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.seg').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.label').forEach(el => el.classList.remove('show'));

    document.getElementById('agent-' + index).classList.add('active');
    document.getElementById('seg-' + index).classList.add('active');
    document.getElementById('label-' + index).classList.add('show');

    current = index;
    if (userTriggered) {
      clearInterval(timer);
      startCycle();
    }
  }

  function startCycle() {
    timer = setInterval(() => {
      current = (current + 1) % total;
      setActive(current, false);
    }, intervalMs);
  }

  setActive(0, false);
  startCycle();

  const boot = document.getElementById('boot');
  const stage = document.getElementById('stage');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduced) {
    boot.style.display = 'none';
    stage.classList.add('reveal');
  } else {
    setTimeout(() => {
      boot.classList.add('hide');
      stage.classList.add('reveal');
    }, 2000);
  }

  // ---------- MUSIC PLACEHOLDER TOGGLE ----------
  // Browsers block autoplay with sound, so music starts muted/off
  // until the user taps the toggle in the top-right corner.
  const musicBtn = document.getElementById('musicToggle');
  const bgMusic = document.getElementById('bgMusic');
  let musicOn = false;

  musicBtn.addEventListener('click', () => {
    musicOn = !musicOn;
    if (musicOn) {
      bgMusic.play().catch(() => {
        // playback failed (e.g. placeholder src is invalid) — reset state
        musicOn = false;
        musicBtn.classList.add('muted');
      });
      musicBtn.classList.remove('muted');
    } else {
      bgMusic.pause();
      musicBtn.classList.add('muted');
    }
  });
</script>

</body>
</html>
